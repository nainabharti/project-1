<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

</head>

<body>

    <header>

        <h1>Student Login</h1>

    </header>


    <nav>

        <a href="index.html">Home</a> |
        <a href="register.html">Register</a>

    </nav>


    <main>

        <form action="#" method="post">

            <fieldset>

                <legend>Login Details</legend>

                <label for="email">
                    Email:
                </label>

                <input type="email"
                       id="email"
                       name="email"
                       required>

                <br><br>


                <label for="password">
                    Password:
                </label>

                <input type="password"
                       id="password"
                       name="password"
                       required>

                <br><br>


                <input type="checkbox"
                       id="remember"
                       name="remember">

                <label for="remember">
                    Remember Me
                </label>

                <br><br>


                <button type="submit">
                    Login
                </button>

            </fieldset>

        </form>

        <p>
            New student?
            <a href="register.html">
                Create an account
            </a>
        </p>

    </main>


    <footer>

        <p>&copy; 2026 College Student Portal</p>

    </footer>

</body>

</html>
