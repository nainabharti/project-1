<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

</head>

<body>

    <header>

        <h1>Student Registration</h1>

        <nav>

            <a href="index.html">Home</a> |
            <a href="login.html">Login</a> |
            <a href="register.html">Register</a>

        </nav>

    </header>


    <main>

        <form action="#" method="post">

            <fieldset>

                <legend>Personal Information</legend>


                <label for="fullname">
                    Full Name:
                </label>

                <input type="text"
                       id="fullname"
                       name="fullname"
                       placeholder="Enter your name"
                       required>

                <br><br>


                <label for="email">
                    Email:
                </label>

                <input type="email"
                       id="email"
                       name="email"
                       placeholder="example@gmail.com"
                       required>

                <br><br>


                <label for="phone">
                    Phone Number:
                </label>

                <input type="tel"
                       id="phone"
                       name="phone"
                       pattern="[0-9]{10}"
                       placeholder="10 digit number"
                       required>

                <br><br>


                <label for="password">
                    Password:
                </label>

                <input type="password"
                       id="password"
                       name="password"
                       minlength="8"
                       required>

                <br><br>


                <label for="dob">
                    Date of Birth:
                </label>

                <input type="date"
                       id="dob"
                       name="dob"
                       required>

                <br><br>


                <p>Gender:</p>

                <input type="radio"
                       id="male"
                       name="gender"
                       value="male">

                <label for="male">Male</label>


                <input type="radio"
                       id="female"
                       name="gender"
                       value="female">

                <label for="female">Female</label>


                <input type="radio"
                       id="other"
                       name="gender"
                       value="other">

                <label for="other">Other</label>

            </fieldset>


            <br>


            <fieldset>

                <legend>Academic Information</legend>


                <label for="course">
                    Select Course:
                </label>

                <select id="course"
                        name="course"
                        required>

                    <option value="">
                        Select Course
                    </option>

                    <option value="btech">
                        B.Tech
                    </option>

                    <option value="mtech">
                        M.Tech
                    </option>

                    <option value="mca">
                        MCA
                    </option>

                    <option value="mba">
                        MBA
                    </option>

                </select>

                <br><br>


                <label for="semester">
                    Semester:
                </label>

                <input type="number"
                       id="semester"
                       name="semester"
                       min="1"
                       max="8">

                <br><br>


                <p>Skills:</p>

                <input type="checkbox"
                       id="html"
                       name="skills"
                       value="html">

                <label for="html">HTML</label>


                <input type="checkbox"
                       id="css"
                       name="skills"
                       value="css">

                <label for="css">CSS</label>


                <input type="checkbox"
                       id="javascript"
                       name="skills"
                       value="javascript">

                <label for="javascript">
                    JavaScript
                </label>

            </fieldset>


            <br>


            <fieldset>

                <legend>Address</legend>


                <label for="address">
                    Address:
                </label>

                <br>

                <textarea id="address"
                          name="address"
                          rows="5"
                          cols="40"
                          placeholder="Enter your complete address">
                </textarea>

                <br><br>


                <label for="city">
                    City:
                </label>

                <input type="text"
                       id="city"
                       name="city">

                <br><br>


                <label for="state">
                    State:
                </label>

                <input type="text"
                       id="state"
                       name="state">

                <br><br>


                <label for="pincode">
                    Pincode:
                </label>

                <input type="number"
                       id="pincode"
                       name="pincode">

            </fieldset>


            <br>


            <fieldset>

                <legend>Documents</legend>


                <label for="photo">
                    Upload Photo:
                </label>

                <input type="file"
                       id="photo"
                       name="photo"
                       accept="image/*">

                <br><br>


                <label for="resume">
                    Upload Resume:
                </label>

                <input type="file"
                       id="resume"
                       name="resume"
                       accept=".pdf,.doc,.docx">

            </fieldset>


            <br>


            <fieldset>

                <legend>Declaration</legend>

                <input type="checkbox"
                       id="declaration"
                       name="declaration"
                       required>

                <label for="declaration">
                    I declare that all information provided
                    by me is correct.
                </label>

            </fieldset>


            <br>

            <input type="submit"
                   value="Register">

            <input type="reset"
                   value="Reset">

        </form>

    </main>


    <footer>

        <p>
            &copy; 2026 College Student Portal
        </p>

    </footer>

</body>

</html>
