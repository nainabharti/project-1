<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Assignments</title>

</head>

<body>

    <header>

        <h1>Assignments</h1>

    </header>


    <main>

        <article>

            <h2>Data Structures Assignment</h2>

            <p>
                Topic:
                <strong>Binary Search Tree</strong>
            </p>

            <p>
                Due Date:
                <time datetime="2026-09-15">
                    15 September 2026
                </time>
            </p>

            <a href="files/dsa-assignment.pdf">
                Download Assignment
            </a>

        </article>


        <hr>


        <article>

            <h2>OOP Assignment</h2>

            <p>
                Topic:
                <strong>Inheritance in C++</strong>
            </p>

            <p>
                Due Date:
                <time datetime="2026-09-20">
                    20 September 2026
                </time>
            </p>

            <a href="files/oop-assignment.pdf">
                Download Assignment
            </a>

        </article>


        <hr>


        <section>

            <h2>Submit Assignment</h2>

            <form action="#" method="post">

                <label for="assignment">
                    Select Assignment:
                </label>

                <select id="assignment"
                        name="assignment">

                    <option value="dsa">
                        DSA
                    </option>

                    <option value="oop">
                        OOP
                    </option>

                </select>

                <br><br>


                <label for="file">
                    Upload File:
                </label>

                <input type="file"
                       id="file"
                       name="file"
                       accept=".pdf,.doc,.docx"
                       required>

                <br><br>


                <button type="submit">
                    Submit Assignment
                </button>

            </form>

        </section>

    </main>


    <footer>

        <p>&copy; 2026 College Student Portal</p>

    </footer>

</body>

</html>
